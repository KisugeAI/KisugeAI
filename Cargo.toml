[package]
name = "KisugeAI"
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
repository = "https://github.com/KisugeAI/KisugeAI"
version = "0.1.0"
edition = "2021"

[dependencies]
birdsite-birdwatch = { git = "ssh://github.com/KisugeAI/KisugeAI" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cli-helpers = "0.1"
csv = "1"
itertools = "0.14"
log = "0.4"
serde = { version = "1", features = ["derive"] }
simplelog = "0.12"
thiserror = "2"
zip = "6"
